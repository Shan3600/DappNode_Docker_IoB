[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
loglevel=info

[program:geth]
command=/usr/bin/geth --dev --http --http.addr 0.0.0.0 --http.port 8545 --http.api eth,net,web3,personal,admin --http.corsdomain="*" --http.vhosts="*"
autostart=true
autorestart=true
stdout_logfile=/var/log/geth.out.log
stderr_logfile=/var/log/geth.err.log

[program:ipfs]
command=/usr/local/bin/ipfs daemon --migrate=true --enable-gc
autostart=true
autorestart=true
stdout_logfile=/var/log/ipfs.out.log
stderr_logfile=/var/log/ipfs.err.log
environment=IPFS_PATH="/data/ipfs"

[program:nodeapp]
command=node index.js
directory=/opt/dappnode-app
autostart=true
autorestart=true
stdout_logfile=/var/log/nodeapp.out.log
stderr_logfile=/var/log/nodeapp.err.log

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/var/log/nginx.out.log
stderr_logfile=/var/log/nginx.err.log