server {
    listen 80 default_server;
    server_name _;

    # Reverse proxy / to dashboard (node app)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Expose IPFS gateway at /ipfs
    location /ipfs {
        proxy_pass http://127.0.0.1:8080;
    }

    # Optional: serve a simple health endpoint
    location /health {
        return 200 "ok\n";
    }
}