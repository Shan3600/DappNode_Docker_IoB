# Cloud Build Trigger Configuration for Pull Request Validation
# Use this file to create the PR validation trigger via gcloud CLI

name: terraform-pr-validation
description: "Validates Terraform configuration on pull requests"
filename: cloudbuild.yaml

github:
  owner: Shan3600
  name: DappNode_Docker_IoB
  pullRequest:
    branch: ^main$
    commentControl: COMMENTS_ENABLED

includedFiles:
  - "terraform/**"
  - "cloudbuild.yaml"

substitutions:
  _TERRAFORM_VERSION: "1.6.6"
  _TERRAFORM_ROOT: "terraform"

tags:
  - terraform
  - pr-validation
  - dappnode
